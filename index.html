<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Планер</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#05070d;--tx:#f3f6fc;--hint:#8693ad;--accent:#2f6bff;--accent2:#6a97ff;--card:rgba(255,255,255,.055);--line:rgba(255,255,255,.09)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;color:var(--tx);font:16px/1.4 -apple-system,system-ui,"Segoe UI",sans-serif;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 16px calc(env(safe-area-inset-bottom,0px) + 124px)}
body::before{content:"";position:fixed;inset:0;z-index:-1;
  background:radial-gradient(100% 46% at 50% -6%,rgba(47,107,255,.85),rgba(18,48,140,.4) 48%,transparent 78%),var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.top b{font-size:18px;letter-spacing:.2px}
.round{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;padding:0}
.round svg{width:20px;height:20px}
.dn{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.dn b{font-size:17px;text-transform:capitalize;text-align:center}
.link{display:block;margin:2px auto 6px;border:0;background:none;color:var(--accent2)}
.hero{margin:18px 2px 20px}
.lab{color:var(--hint);font-size:15px}
.big{font-size:68px;line-height:1.05;font-weight:800;letter-spacing:-1px}
.big span{color:var(--hint);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px 16px;margin-bottom:14px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.card.late{border-style:dashed;border-color:rgba(106,151,255,.45)}
h3{margin:0 0 6px;font-size:20px;font-weight:700}
.empty{color:var(--hint);padding:4px 0}
.ls{display:flex;gap:12px;align-items:center;padding:7px 0}
.ls i{font-style:normal;flex:none;width:26px;height:26px;border-radius:9px;background:rgba(47,107,255,.22);color:var(--accent2);display:grid;place-items:center;font-size:13px;font-weight:700}
.row{display:flex;align-items:center;gap:12px;padding:9px 0}
.row .t{flex:1;min-width:0;overflow-wrap:anywhere}
.row.done .t{color:var(--hint);text-decoration:line-through}
.row small{color:var(--hint)}
input[type=checkbox]{-webkit-appearance:none;appearance:none;flex:none;width:26px;height:26px;margin:0;border-radius:50%;border:2px solid #3b4a68;display:grid;place-items:center;background:transparent}
input[type=checkbox]:checked{background:var(--accent);border-color:var(--accent);box-shadow:0 0 14px rgba(47,107,255,.55)}
input[type=checkbox]:checked::after{content:"";width:6px;height:12px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.x{border:0;background:none;color:var(--hint);font-size:22px;padding:0 4px}
.add{display:flex;gap:8px;margin-top:4px}
input[type=text],input[type=time],input[type=number],textarea{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.06);color:var(--tx);font:inherit;outline:none}
input:focus,textarea:focus{border-color:var(--accent)}
.add input[type=text]{flex:1;min-width:0}.add input[type=time]{width:112px;flex:none}
.btn{border:0;border-radius:14px;background:var(--accent);color:#fff;padding:12px 18px;font-weight:600;box-shadow:0 6px 20px rgba(47,107,255,.4)}
label{display:block;margin:14px 0 6px;color:var(--hint);font-size:14px}
textarea{min-height:90px;resize:vertical}
.note{color:var(--hint);font-size:14px;margin:0 0 4px}
.msg{color:var(--accent2);text-align:center;margin-top:10px;min-height:20px}
.bar{position:fixed;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);height:68px;border-radius:34px;
  background:rgba(16,22,36,.86);border:1px solid var(--line);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  display:grid;grid-template-columns:1fr 88px 1fr;align-items:center;padding:0 8px}
.bar button[data-v]{border:0;background:none;color:var(--hint);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;padding:6px 0;border-radius:24px}
.bar button[data-v] svg{width:24px;height:24px}
.bar button[data-v].on{color:var(--accent2)}
.plus{justify-self:center;width:68px;height:68px;margin-top:-26px;border-radius:50%;border:4px solid var(--bg);padding:0;
  background:linear-gradient(160deg,#5b8dff,#2f6bff 60%,#1f4fd0);box-shadow:0 8px 28px rgba(47,107,255,.6);display:grid;place-items:center}
.plus svg{width:30px;height:30px}
</style>
</head>
<body>
<div class="top"><b>Планер</b>
  <button class="round" data-v="settings" aria-label="Настройки"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg></button>
</div>
<div id="app"></div>
<nav class="bar">
  <button data-v="day" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7v9H4z"/></svg>День</button>
  <button class="plus" onclick="plus()" aria-label="Добавить дело"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
  <button data-v="schedule"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Уроки</button>
</nav>

<script>
const tg = Telegram.WebApp; tg.ready(); tg.expand();
try { tg.setHeaderColor('#05070d'); tg.setBackgroundColor('#05070d'); } catch (e) {}
const app = document.getElementById('app');
const DAYS = ['Понедельник','Вторник','Среда','Четверг','Пятница','Суббота','Воскресенье'];
let view = 'day', cur = null, today = null;

const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path, opts = {}) {
  const r = await fetch('/api/' + path, {...opts, headers: {'Content-Type': 'application/json', 'X-Init-Data': tg.initData}});
  if (!r.ok) {
    let m = 'Ошибка ' + r.status;
    try { m = (await r.json()).detail || m; } catch (e) {}
    throw new Error(m);
  }
  return r.json();
}
const shift = (d, n) => { const x = new Date(d + 'T00:00:00Z'); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0, 10); };
const longDate = d => new Date(d + 'T00:00:00Z').toLocaleDateString('ru', {weekday:'long', day:'numeric', month:'long', timeZone:'UTC'});
const shortDate = d => new Date(d + 'T00:00:00Z').toLocaleDateString('ru', {day:'numeric', month:'short', timeZone:'UTC'});

function setView(v) {
  view = v;
  document.querySelectorAll('.bar button[data-v]').forEach(x => x.classList.toggle('on', x.dataset.v === v));
  render();
}
document.querySelectorAll('[data-v]').forEach(b => b.onclick = () => setView(b.dataset.v));

function taskRow(t, extra = '') {
  return `<div class="row ${t.done ? 'done' : ''}">
    <input type="checkbox" ${t.done ? 'checked' : ''} onchange="toggle(${t.id}, this.checked)">
    <div class="t">${t.at ? `<small>${esc(t.at)}</small> ` : ''}${esc(t.title)}${extra}</div>
    <button class="x" onclick="del(${t.id})" aria-label="Удалить">×</button></div>`;
}

async function renderDay() {
  const d = await api('day' + (cur ? '?d=' + cur : ''));
  cur = d.date; today = d.today;
  const done = d.tasks.filter(t => t.done).length;
  let h = `<div class="dn"><button class="round" onclick="go(-1)">‹</button><b>${longDate(cur)}</b><button class="round" onclick="go(1)">›</button></div>`;
  if (cur !== today) h += `<button class="link" onclick="cur=null;render()">Вернуться на сегодня</button>`;
  h += `<div class="hero"><div class="lab">Сделано</div><div class="big">${done}<span> / ${d.tasks.length}</span></div></div>`;
  h += `<div class="card"><h3>Уроки</h3>` + (d.lessons.length
    ? d.lessons.map((l, i) => `<div class="ls"><i>${i + 1}</i><div>${esc(l)}</div></div>`).join('')
    : `<div class="empty">Уроков нет. Добавь расписание на вкладке «Уроки».</div>`) + `</div>`;
  if (cur === today && d.overdue.length)
    h += `<div class="card late"><h3>Вчерашние дела</h3>${d.overdue.map(t => taskRow({...t, done: 0}, ` <small>(${shortDate(t.day)})</small>`)).join('')}</div>`;
  h += `<div class="card"><h3>Дела</h3>` + (d.tasks.length ? d.tasks.map(t => taskRow(t)).join('') : `<div class="empty">Пока пусто</div>`) +
    `</div><div class="add"><input type="text" id="nt" placeholder="Новое дело" maxlength="200"><input type="time" id="nm"><button class="btn" onclick="add()">Добавить</button></div><div class="msg" id="msg"></div>`;
  app.innerHTML = h;
  document.getElementById('nt').addEventListener('keydown', e => { if (e.key === 'Enter') add(); });
}

async function renderSchedule() {
  const s = await api('schedule');
  app.innerHTML = `<div class="hero"><div class="big" style="font-size:34px">Уроки</div></div>
    <p class="note">Один урок на строке. Можно с временем: «8:30 Математика». Расписание повторяется каждую неделю.</p>` +
    DAYS.map((n, i) => `<label>${n}</label><textarea id="d${i}">${esc(s.days[i])}</textarea>`).join('') +
    `<p><button class="btn" onclick="saveSchedule()">Сохранить</button></p><div class="msg" id="msg"></div>`;
}

async function renderSettings() {
  const s = await api('settings');
  app.innerHTML = `<div class="hero"><div class="big" style="font-size:34px">Настройки</div></div>
    <label>Часовой пояс</label><input type="text" id="tz" value="${esc(s.tz)}">
    <label>Уроки на день приходят в</label><input type="time" id="morning" value="${s.morning}">
    <label>Первое напоминание о делах</label><input type="time" id="first" value="${s.first}">
    <label>Повторять каждые (часов)</label><input type="number" id="every" min="1" max="12" value="${s.every}">
    <label>Последнее напоминание</label><input type="time" id="last" value="${s.last}">
    <p><button class="btn" onclick="saveSettings()">Сохранить</button></p><div class="msg" id="msg"></div>`;
}

async function render() {
  try { await ({day: renderDay, schedule: renderSchedule, settings: renderSettings})[view](); }
  catch (e) { app.innerHTML = `<p class="empty">${esc(e.message)}</p>`; }
}
const say = t => { const m = document.getElementById('msg'); if (m) m.textContent = t; };

async function plus() {
  if (view !== 'day') { view = 'day'; document.querySelectorAll('.bar button[data-v]').forEach(x => x.classList.toggle('on', x.dataset.v === 'day')); await render(); }
  const i = document.getElementById('nt');
  if (i) { i.scrollIntoView({behavior: 'smooth', block: 'center'}); i.focus(); }
}
function go(n) { cur = shift(cur, n); render(); }
async function add() {
  const title = document.getElementById('nt').value.trim();
  if (!title) return say('Напиши, что нужно сделать');
  try {
    await api('tasks', {method: 'POST', body: JSON.stringify({day: cur, title, at: document.getElementById('nm').value})});
    render();
  } catch (e) { say(e.message); }
}
async function toggle(id, done) { try { await api('tasks/' + id, {method: 'PATCH', body: JSON.stringify({done})}); } catch (e) {} render(); }
async function del(id) { try { await api('tasks/' + id, {method: 'DELETE'}); } catch (e) {} render(); }
async function saveSchedule() {
  try {
    await api('schedule', {method: 'PUT', body: JSON.stringify({days: DAYS.map((_, i) => document.getElementById('d' + i).value)})});
    say('Сохранено');
  } catch (e) { say(e.message); }
}
async function saveSettings() {
  const v = id => document.getElementById(id).value;
  try {
    await api('settings', {method: 'PUT', body: JSON.stringify({tz: v('tz').trim(), morning: v('morning'), first: v('first'), every: +v('every'), last: v('last')})});
    say('Сохранено');
  } catch (e) { say(e.message); }
}
render();
</script>
</body>
</html>
